name: HTML Check

on: [push, pull_request]

jobs:
  validate-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HTML validation
        run: |
          echo "HTML файлдары тексерілді"
          if [ -f "index.html" ]; then
            echo "index.html табылды!"
          else
            echo "Қате: index.html табылмады!"
            exit 1
          fi